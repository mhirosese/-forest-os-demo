<!doctype html>
<!-- Forest OS v20: visibility-first terrain-aware map display -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest OS デモ｜青嶺町 v20</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7f5;--panel:#fff;--line:#dfe3df;--text:#1f2922;--muted:#66736a;--accent:#2f5d40;--soft:#eef3ef;--warn:#8b5a13}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
h1{margin:0;font-size:20px} .sub{margin-top:4px;color:var(--muted);font-size:12px}
nav{display:flex;gap:8px;overflow:auto;padding-top:12px}
button{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:8px;white-space:nowrap;font-size:14px}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:16px;max-width:1180px;margin:auto}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}
.card .label{font-size:12px;color:var(--muted)} .card .value{margin-top:5px;font-size:22px;font-weight:650}
section{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
section h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.tablewrap{overflow:auto} table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #edf0ed;vertical-align:top}
th{color:var(--muted);font-weight:600;background:#fafbfa}
.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--soft);font-size:11px}
.warn{color:var(--warn);font-weight:600} .empty{padding:14px;color:var(--muted);font-size:13px}
.footer{color:var(--muted);font-size:11px;padding:4px 2px 24px}
.selector{width:100%;max-width:520px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;margin-bottom:14px}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0}
.detailitem{padding:11px 14px;border-bottom:1px solid #edf0ed}
.detailitem .k{font-size:11px;color:var(--muted);margin-bottom:4px}
.detailitem .v{font-size:14px;line-height:1.45}


.doclink{color:#1f5f3b;text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer}
.doclink:hover{opacity:.75}
.modal{position:fixed;inset:0;background:rgba(20,28,23,.58);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow:auto}
.modal.open{display:flex}
.viewerbox{width:min(900px,100%);background:#f4f5f2;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.25);overflow:hidden}
.viewerhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:11px 14px}
.viewerhead strong{font-size:14px}
.closebtn{font-size:13px;padding:7px 11px}
.viewerbody{padding:16px}
.demo-note{font-size:12px;color:var(--muted);margin-bottom:10px}
.docpaper{max-width:720px;margin:0 auto;background:#fff;min-height:720px;padding:42px 46px;border:1px solid #d6d9d6;box-shadow:0 5px 18px rgba(0,0,0,.08);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.9}
.docpaper h3{text-align:center;font-size:22px;margin:4px 0 28px}
.docpaper .meta{font-size:13px;margin:8px 0 22px}
.docpaper h4{font-size:15px;margin:20px 0 5px}
.docpaper p{font-size:14px;margin:4px 0}
.signature{margin-top:40px;border-top:1px solid #ddd;padding-top:18px}
.mockphoto{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);padding:12px}
.mockphoto svg{display:block;width:100%;height:auto;background:#dfe9e1}
.photometa{font-size:12px;color:var(--muted);padding:10px 2px 2px}



.layergroups{display:flex;flex-direction:column;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfa}
.layergroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;overflow:visible}
.layergrouptitle{font-size:10px;font-weight:700;color:#5c675f;min-width:56px}
.layercheck.water-toggle{border-color:#7caac0;background:#f3f9fc;font-weight:700}
.layercheck.water-toggle:has(input:checked){background:#dceef6;border-color:#4d8eab}
.layercheck.reference-toggle{border-color:#9caf9b;background:#f3f7f2;font-weight:700}
.layercheck.reference-toggle:has(input:checked){background:#e4eee2;border-color:#6f8f72}
@media(max-width:600px){
 .layergroups{padding:8px}
 .layergroup{gap:5px}
 .layergrouptitle{width:100%;min-width:0;margin-top:2px}
 .layercheck{font-size:10px;padding:5px 7px}
}

.layerbar{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfa}
.layercheck{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;user-select:none}
.layercheck input{margin:0}
.layercheck:has(input:checked){background:#eef5ef;border-color:#a5bda9;box-shadow:inset 0 0 0 1px rgba(86,118,92,.05)}
.mapaction{padding:12px 14px;border-top:1px solid var(--line)}
.primarybtn{border:1px solid #2f6b45;background:#2f6b45;color:#fff;border-radius:7px;padding:9px 12px;font-size:13px;font-weight:650;cursor:pointer;width:100%}
.primarybtn:hover{opacity:.88}
.map-summary-note{font-size:11px;color:var(--muted);padding:0 14px 10px}

.maplayout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:12px;margin-bottom:14px}
.mapsection{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.maphead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.maphead strong{font-size:14px}.maphead span{font-size:11px;color:var(--muted)}
.mapcanvas{position:relative;background:#eef2eb;min-height:560px;overflow:hidden}
#leafletTownMap{height:610px;width:100%;background:#eef2eb}.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:9px}.map-source-note{font-size:10px;color:var(--muted);line-height:1.45}
.activelegend{position:absolute;left:10px;bottom:10px;z-index:450;background:rgba(255,255,255,.93);backdrop-filter:blur(4px);border:1px solid rgba(150,160,153,.45);border-radius:9px;padding:8px 9px;box-shadow:0 3px 14px rgba(0,0,0,.08);max-width:190px;font-size:10px;line-height:1.45}.activelegend strong{display:block;font-size:10px;margin-bottom:4px;color:#425048}.activelegend .legendrow{margin:2px 0}.activelegend .swatch.line{height:3px;border-radius:999px;border:0}.activelegend .swatch.dash{height:0;border:0;border-top:2px dashed currentColor;background:transparent;border-radius:0}.mapmodebadge{font-size:10px;color:#496253;background:#eef4ef;border:1px solid #cad8cd;border-radius:999px;padding:3px 7px;white-space:nowrap}
.maplegend{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:10px;line-height:1.65;z-index:2;max-width:190px}
.legendrow{display:flex;align-items:center;gap:6px;white-space:nowrap}.swatch{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.mapdetail{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mapdetail h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.mapdetail .detailgrid{grid-template-columns:1fr}
.maplabel{font-size:11px;font-weight:650;fill:#243028;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.maparea{cursor:pointer;transition:opacity .15s,stroke-width .15s}.maparea:hover{opacity:.82;stroke-width:3}
.detailarea{cursor:pointer;stroke-width:3}.detailarea:hover{stroke-width:5}
.map-note{font-size:11px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:#fafbfa}
.statusline{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.statuspill{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}

.coveragebar{height:7px;background:#edf0ed;border-radius:999px;overflow:hidden;margin-top:5px}.coveragebar>span{display:block;height:100%;background:#6f8f72}.coveragegrid{display:flex;gap:4px;flex-wrap:wrap}.covchip{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:#fff}.cov-confirmed{background:#e8f1e9;border-color:#aac0ad}.cov-partial{background:#f6f0df;border-color:#d9c58d}.cov-unknown,.cov-not_available{background:#f1f1f1;color:#69716b}.cov-not_applicable{background:#eef3f7;color:#536b7b}.smallnote{font-size:11px;color:var(--muted);line-height:1.5}.density{font-weight:700}.density-濃い{color:#2f6b45}.density-標準{color:#5e7245}.density-薄い{color:#8b6f47}.density-要整理{color:#8b4e4e}
@media(max-width:800px){.maplayout{grid-template-columns:1fr}.mapcanvas{min-height:540px}.maplegend{max-width:170px}#leafletTownMap{height:620px}.activelegend{max-width:170px;left:8px;bottom:8px}}

@media(max-width:600px){.viewerbody{padding:8px}.docpaper{padding:28px 20px;min-height:620px}.docpaper h3{font-size:19px}}

@media(max-width:600px){header{padding:14px 12px 10px}main{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}.card .value{font-size:18px}}

.river-permanent-label{background:rgba(255,255,255,.90)!important;border:0!important;box-shadow:none!important;color:#4f7f97!important;font-size:10px!important;font-weight:700!important;padding:1px 4px!important;border-radius:4px!important}
.river-permanent-label:before{display:none!important}

/* v20 visibility-first map tuning */
#leafletTownMap{filter:saturate(.92) contrast(1.03)}
.activelegend{background:rgba(255,255,255,.96);font-size:10.5px}
@media(max-width:600px){
 #leafletTownMap{height:640px}
 .activelegend{max-width:158px;padding:7px 8px}
}
</style>
</head>
<body>
<header>
<h1>Forest OS <span style="font-weight:400">｜【デモ】青嶺町</span></h1>
<div class="sub">立場・業務・森林の各入口から、同じ森林データを確認</div>
<nav>
<button data-role="municipality" class="active">自治体</button>
<button data-role="forest_coop">森林組合</button>
<button data-role="forestry_company">林業会社</button>
<button data-role="owner">山主</button>
<button data-role="accounting">会計</button>
<button data-role="jcredit">J-クレジットPJ</button>
<button data-role="pm">PM</button>
<button data-role="forest">森林</button>
<button data-role="town_map">森林全体マップ</button>
</nav>
</header>
<main>
<div id="notice" class="notice">公開デモ用Viewのみを読み込みます。実GIS参照データと架空業務データを分離表示します。</div>
<div id="cards" class="cards"></div>
<div id="content"></div>
<div class="footer">デモ専用。青嶺町・業務情報は架空。背景地形・森林分布・土砂災害は出典明示した参照データ。正本データと表示用一般化形状を分離しています。</div>
</main>

<div id="viewer" class="modal" aria-hidden="true">
  <div class="viewerbox">
    <div class="viewerhead">
      <strong id="viewerTitle">資料</strong>
      <button class="closebtn" type="button" onclick="closeViewer()">閉じる</button>
    </div>
    <div id="viewerBody" class="viewerbody"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SB_URL='https://otjkxkwvzfldvtkgskwt.supabase.co';
const SB_KEY='sb_publishable_zjO6dLW97prGmZ7RablhMA_G1qfv1FQ';
async function q(view,params='select=*'){
 const r=await fetch(`${SB_URL}/rest/v1/${view}?${params}`,{headers:{apikey:SB_KEY}});
 if(!r.ok)throw new Error(`${view}: ${r.status}`);
 return r.json();
}
const yen=n=>n==null?'—':new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n));
const num=n=>n==null?'—':new Intl.NumberFormat('ja-JP').format(Number(n));
const ha=n=>n==null?'—':`${Number(n).toFixed(1)} ha`;
const date=s=>s?s.replaceAll('-','/'):'—';
const txt=v=>(v===null||v===undefined||v==='')?'—':String(v);

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasAudience=(x,role)=>Array.isArray(x?.audience_codes)&&x.audience_codes.includes(role);
const mockLink=(ref,label='開く')=>ref?`<a href="#viewer" class="doclink" data-mock="${esc(ref)}">${esc(label)}</a>`:'—';
const evidenceLabel=t=>String(t||'').includes('report')?'報告書を開く':'写真を開く';
function cards(items){document.getElementById('cards').innerHTML=items.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function table(title,headers,rows){
 if(!rows.length)return `<section><h2>${title}</h2><div class="empty">該当データなし</div></section>`;
 return `<section><h2>${title}</h2><div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}
async function municipality(){
 const [f,j,t,allc]=await Promise.all([
   q('demo_municipality_forest','select=*&order=name'),
   q('demo_jcredit_project'),
   q('demo_role_task',"select=*&role_code=eq.municipality&order=due_on"),
   q('demo_contract_relation','select=*&order=contract_no')
 ]);
 const c=allc.filter(x=>hasAudience(x,'municipality'));
 const area=f.reduce((s,x)=>s+Number(x.area_ha||0),0), unresolved=f.reduce((s,x)=>s+Number(x.unresolved_right_count||0),0);
 const jcIssued=j.reduce((s,x)=>s+Number(x.issued_quantity_t||0),0), jcFund=j.reduce((s,x)=>s+Number(x.linked_fund_balance||0),0);
 cards([['管理森林',`${f.length}件`],['管理面積',ha(area)],['権利未整理',`${unresolved}件`],['J-クレジット案件',`${j.length}件`],['J-クレジット発行',`${num(jcIssued)} t`],['基金残高',yen(jcFund)]]);
 document.getElementById('content').innerHTML=
 table('地域全体の森林',['森林','面積','状態','権利未整理','施業状態','次期限','災害','J-クレジット'],f.map(x=>[x.name,ha(x.area_ha),`<span class="tag">${txt(x.forest_status)}</span>`,Number(x.unresolved_right_count||0)?`<span class="warn">${x.unresolved_right_count}件</span>`:'0件',txt(x.latest_work_status),date(x.next_due_on),`${x.active_incident_count}件`,`${x.active_jcredit_project_count}件`]))+
 table('関係契約',['契約','当事者','対象','期間','状態','契約書'],c.map(x=>[
   x.title,txt(x.parties_text),txt(x.target_name),`${date(x.starts_on)}〜${date(x.ends_on)}`,txt(x.status),mockLink(x.mock_ref,'契約書を開く')
 ]))+
 table('J-クレジットPJ',['PJ','対象面積','発行','販売可能','リスク留保','売却済','売上','補填案件','基金'],j.map(x=>[x.name,ha(x.target_area_ha),`${num(x.issued_quantity_t)}t`,`${num(x.available_quantity_t)}t`,`${num(x.risk_reserved_quantity_t)}t`,`${num(x.sold_quantity_t)}t`,yen(x.sales_amount_in_tax),`${x.open_compensation_cases}件`,yen(x.linked_fund_balance)]))+
 table('自治体タスク',['期限','内容','担当','状態'],t.map(x=>[date(x.due_on),x.title,x.assigned_to,x.status]));
}
async function forestCoop(){
 const [f,j,t,allc,wc]=await Promise.all([
   q('demo_forest_coop_operation','select=*&order=name'),
   q('demo_jcredit_project'),
   q('demo_role_task',"select=*&role_code=eq.forest_coop&order=due_on"),
   q('demo_contract_relation','select=*&order=contract_no'),
   q('demo_work_credit_context','select=*')
 ]);
 const c=allc.filter(x=>hasAudience(x,'forest_coop'));
 const jcAvailable=j.reduce((s,x)=>s+Number(x.available_quantity_t||0),0), jcReserve=j.reduce((s,x)=>s+Number(x.risk_reserved_quantity_t||0),0);
 cards([['担当森林',`${f.length}件`],['担当面積',ha(f.reduce((s,x)=>s+Number(x.area_ha||0),0))],['未完了タスク',`${t.filter(x=>x.status!=='completed').length}件`],['J-クレジット案件',`${j.length}件`],['販売可能クレジット',`${num(jcAvailable)} t`],['リスク留保',`${num(jcReserve)} t`]]);
 document.getElementById('content').innerHTML=
 table('森林・施業管理',['森林','面積','直近作業','状態','クレジット','PJ段階','必要証憑','次期限','災害'],f.map(x=>{
   const z=wc.find(v=>v.forest_name===x.name);
   return [x.name,ha(x.area_ha),txt(x.latest_work_type),txt(x.latest_work_status),txt(z?.jcredit_status),txt(z?.project_stage),txt(z?.evidence_requirements),date(x.next_due_on),`${x.active_incident_count}件`];
 }))+
 table('関係契約',['契約','当事者','対象','期間','状態','契約書'],c.map(x=>[
   x.title,txt(x.parties_text),txt(x.target_name),`${date(x.starts_on)}〜${date(x.ends_on)}`,txt(x.status),mockLink(x.mock_ref,'契約書を開く')
 ]))+
 table('やること',['期限','優先度','内容','状態'],t.map(x=>[date(x.due_on),x.priority,x.title,x.status]))+
 table('J-クレジット管理',['PJ','発行','販売可能','留保','売却済','基金'],j.map(x=>[x.name,`${num(x.issued_quantity_t)}t`,`${num(x.available_quantity_t)}t`,`${num(x.risk_reserved_quantity_t)}t`,`${num(x.sold_quantity_t)}t`,yen(x.linked_fund_balance)]));
}
async function forestryCompany(){
 const [w,allc,alle,wc]=await Promise.all([
   q('demo_forestry_company_work','select=*&order=title'),
   q('demo_contract_relation','select=*&order=contract_no'),
   q('demo_work_evidence','select=*'),
   q('demo_work_credit_context','select=*')
 ]);
 const c=allc.filter(x=>hasAudience(x,'forestry_company'));
 const e=alle.filter(x=>hasAudience(x,'forestry_company'));
 cards([['受託案件',`${w.length}件`],['計画面積',ha(w.reduce((s,x)=>s+Number(x.planned_area_ha||0),0))],['実績面積',ha(w.reduce((s,x)=>s+Number(x.actual_area_ha||0),0))],['完了案件',`${w.filter(x=>x.work_status==='completed').length}件`]]);
 document.getElementById('content').innerHTML=
 table('自社が受託している作業',['案件','森林','作業','計画','実績','クレジット','PJ','段階','必要証憑','作業日','検収','契約書'],w.map(x=>{
   const cc=c.find(z=>z.forest_unit_id===x.forest_unit_id);
   const z=wc.find(v=>v.work_case_id===x.work_case_id);
   return [x.title,txt(x.forest_name),txt(x.work_type_name),ha(x.planned_area_ha),ha(x.actual_area_ha),txt(z?.jcredit_status),txt(z?.jcredit_project_name),txt(z?.project_stage),txt(z?.evidence_requirements),date(x.latest_event_date),txt(x.inspection_status),cc?mockLink(cc.mock_ref,'契約書を開く'):'—'];
 }))+
 table('作業記録・証憑',['作業','日付','資料','表示'],e.map(x=>[
   x.work_title,date(x.event_date),x.title,mockLink(x.mock_ref,evidenceLabel(x.evidence_type))
 ]));
}
async function owner(){
 const [f,allc,alle]=await Promise.all([
   q('demo_owner_forest','select=*&order=name'),
   q('demo_contract_relation','select=*&order=contract_no'),
   q('demo_work_evidence','select=*')
 ]);
 const c=allc.filter(x=>hasAudience(x,'owner'));
 const e=alle.filter(x=>hasAudience(x,'owner'));
 const total=f.reduce((s,x)=>s+Number(x.planned_distribution_amount||0),0);

 if(!v)return null;
 if(typeof v==='object')return v;

// 町全体マップは精密境界ではなく概況把握を優先する。
// 正本の100mメッシュ／課題形状はDBに保持し、表示時だけブロック単位の外周へ一般化する。
function collectGeoPoints(gj){
 const pts=[];
 const walk=x=>{
  if(Array.isArray(x)&&x.length>=2&&typeof x[0]==='number'&&typeof x[1]==='number'){pts.push([x[0],x[1]]);return;}
  if(Array.isArray(x))x.forEach(walk);
 };
 if(gj&&gj.coordinates)walk(gj.coordinates);
 return pts;
}
function convexHull(points){
 const uniq=[...new Map(points.map(p=>[`${p[0].toFixed(7)},${p[1].toFixed(7)}`,p])).values()];
 if(uniq.length<3)return uniq;
 uniq.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
 const lower=[]; for(const p of uniq){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);}
 const upper=[]; for(let i=uniq.length-1;i>=0;i--){const p=uniq[i];while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);}
 const hull=lower.slice(0,-1).concat(upper.slice(0,-1));
 if(hull.length)hull.push(hull[0]);
 return hull;
}
function townBoundaryBBox(){
 const b=townMapFeatures.find(f=>f.feature_code==='AOMINE-TOWN');
 const pts=b?collectGeoPoints(geoObj(b.geom_geojson)):[];
 if(!pts.length)return {minLon:135.82,maxLon:135.95,minLat:34.118,maxLat:34.24};
 return {minLon:Math.min(...pts.map(p=>p[0])),maxLon:Math.max(...pts.map(p=>p[0])),minLat:Math.min(...pts.map(p=>p[1])),maxLat:Math.max(...pts.map(p=>p[1]))};
}
function townBlockPointExtent(){
 const pts=[];
 townBlocks.forEach(b=>parseParts(b.map_parts).forEach(part=>String(part.points||'').trim().split(/\s+/).forEach(pair=>{
  const [x,y]=pair.split(',').map(Number);if(Number.isFinite(x)&&Number.isFinite(y))pts.push([x,y]);
 })));
 if(!pts.length)return {minX:0,maxX:1000,minY:0,maxY:700};
 return {minX:Math.min(...pts.map(p=>p[0])),maxX:Math.max(...pts.map(p=>p[0])),minY:Math.min(...pts.map(p=>p[1])),maxY:Math.max(...pts.map(p=>p[1]))};
}
function blockPartToRing(pointsText){
 const box=townBoundaryBBox(), ext=townBlockPointExtent();
 const padX=(box.maxLon-box.minLon)*.035,padY=(box.maxLat-box.minLat)*.035;
 const minLon=box.minLon+padX,maxLon=box.maxLon-padX,minLat=box.minLat+padY,maxLat=box.maxLat-padY;
 const arr=String(pointsText||'').trim().split(/\s+/).map(pair=>pair.split(',').map(Number)).filter(a=>a.length===2&&a.every(Number.isFinite));
 const ring=arr.map(([x,y])=>{
  const nx=(x-ext.minX)/Math.max(1,ext.maxX-ext.minX), ny=(y-ext.minY)/Math.max(1,ext.maxY-ext.minY);
  return [minLon+nx*(maxLon-minLon), maxLat-ny*(maxLat-minLat)];
 });
 if(ring.length&& (ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1]))ring.push([...ring[0]]);
 return ring;
}
function blockFeature(block,mode,issueIds=[]){

 if(!parts.length)return null;
 const geom=parts.length===1?{type:'Polygon',coordinates:[parts[0]]}:{type:'MultiPolygon',coordinates:parts.map(r=>[r])};
 const rows=townIssues.filter(x=>issueIds.includes(x.issue_area_id));
 return {
  feature_code:`BLK-${mode}-${block.block_code}`,layer_code:mode==='reference'?'forest_block_overview':'issue_overview',
  display_name:`${block.block_name}${mode==='reference'?'':mode==='issues'?'・未整理概況':mode==='owner_unknown'?'・所有相続概況':'・境界概況'}`,

 };
}

function addFeatureGeoJSON(f,mode){
 const gj=geoObj(f.geom_geojson); if(!gj||!leafletTownMap)return null;
 const color=layerColor(mode);
 const opts={
  style:()=>({color,weight:mode==='water'?3:2,fillColor:color,fillOpacity:mode==='water'?0.35:0.42,dashArray:mode==='issues'||mode==='owner_unknown'||mode==='boundary_unknown'?'6 4':null}),
  pointToLayer:(feature,latlng)=>L.circleMarker(latlng,{radius:mode==='water'?7:6,color:'#fff',weight:2,fillColor:color,fillOpacity:.95}),
  onEachFeature:(feature,layer)=>{
   layer.on('click',()=>handleMapFeatureClick(f));
   if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});
  }
 };
 return L.geoJSON(gj,opts).addTo(leafletTownMap);
}

function addFeatureGeoJSONToGroup(f,mode,group){
 const gj=mode==='water'?displayWaterGeometry(f):geoObj(f.geom_geojson);if(!gj)return null;const color=layerColor(mode);
 const subtype=String(f.feature_subtype||'');
 const isWater=mode==='water';
 let fillOpacity=.12,weight=0,dashArray=null,opacity=.62,smoothFactor=3.4;
 // v20 視認性優先：町全体では内部境界を描かず、面の意味だけを残す。
 // 正本GISの細かさはDBに保持し、通常画面では地形とテーマが読めることを優先する。
 if(mode==='reference'){fillOpacity=.115;weight=0;opacity=0;smoothFactor=4.2;}
 if(mode==='details'){fillOpacity=.07;weight=1.15;opacity=.78;smoothFactor=2.8;}
 if(mode==='issues'){fillOpacity=.105;weight=0;opacity=0;smoothFactor=4.4;}
 if(mode==='owner_unknown'){fillOpacity=.055;weight=.45;opacity=.26;dashArray='3 7';smoothFactor=4.4;}
 if(mode==='boundary_unknown'){fillOpacity=0;weight=.72;opacity=.42;dashArray='7 8';smoothFactor=4.4;}
 if(mode==='credit'){fillOpacity=.16;weight=1.25;opacity=.88;smoothFactor=3.0;}
 if(mode==='candidate'){fillOpacity=.14;weight=1.2;opacity=.86;smoothFactor=3.0;}
 if(mode==='program'){fillOpacity=.14;weight=1.2;opacity=.84;smoothFactor=3.0;}
 if(mode==='disaster'){fillOpacity=f.is_fictional ? .10 : .055;weight=f.is_fictional ? 1.15 : .7;opacity=.78;smoothFactor=3.2;}

 // 水系は「青い線」ではなく、淡い河道＋芯線で河川らしく見せる。
 // DBの実データを使う本番でも同じ描画方式を流用できる。
 if(isWater && (subtype==='river' || subtype==='tributary')){
   const isMain=subtype==='river';
   const halo=L.geoJSON(gj,{
     smoothFactor:1.0,
     style:()=>({color:isMain?'#cfe7f1':'#dcecf3',weight:isMain?4.1:2.8,opacity:isMain?.46:.34,lineCap:'round',lineJoin:'round'}),
     onEachFeature:(feature,layer)=>{layer.on('click',()=>handleMapFeatureClick(f));if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});}
   });
   halo.addTo(group);
   const core=L.geoJSON(gj,{
     smoothFactor:1.0,
     style:()=>({color:isMain?'#4f8daa':'#78a9bd',weight:isMain?1.35:.90,opacity:isMain?.88:.70,lineCap:'round',lineJoin:'round'}),
     onEachFeature:(feature,layer)=>{
       layer.on('click',()=>handleMapFeatureClick(f));
       if(f.feature_code==='RIVER-MID'){layer.bindTooltip('青嶺川',{permanent:true,direction:'center',className:'river-permanent-label'});}
       else if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});
     }
   });
   core.addTo(group);return core;
 }

 if(isWater){
   opacity=.72;smoothFactor=2.0;
   if(['watershed','catchment'].includes(subtype)){fillOpacity=.006;weight=.45;opacity=.14;dashArray='4 10';}
   else if(['reservoir','lake','dam_lake'].includes(subtype)){fillOpacity=.34;weight=.8;opacity=.68;}
   else if(subtype==='dam'){fillOpacity=.06;weight=.7;opacity=.64;}
   else if(subtype==='water_source'){fillOpacity=.06;weight=.65;opacity=.58;}
   else {fillOpacity=.04;weight=.55;opacity=.50;}
 }
 const lyr=L.geoJSON(gj,{
  smoothFactor,
  style:()=>({color,weight,opacity,fillColor:isWater&&['reservoir','lake','dam_lake'].includes(subtype)?'#8fc5dc':color,fillOpacity,dashArray,lineCap:'round',lineJoin:'round'}),
  pointToLayer:(feature,latlng)=>L.circleMarker(latlng,{radius:subtype==='dam'?3.2:subtype==='water_source'?2.7:3.5,color:'#fff',weight:1,fillColor:color,fillOpacity:.78}),
  onEachFeature:(feature,layer)=>{layer.on('click',()=>handleMapFeatureClick(f));if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});}
 });
 lyr.addTo(group);return lyr;
}
function addWorkScopeToGroup(w,group){
 const gj=geoObj(w.geom_geojson);if(!gj)return null;const color=layerColor('operations');
 const exact=!!w.exact_work_polygon;
 const lyr=L.geoJSON(gj,{
  style:()=>({color,weight:1.25,opacity:.85,fillColor:color,fillOpacity:.18,dashArray:exact?null:'5 4'}),
  onEachFeature:(feature,layer)=>{
   layer.on('click',()=>renderWorkScopeDetail(w));
   layer.bindTooltip(w.work_title||'施業',{sticky:true,direction:'top'});
  }
 });
 lyr.addTo(group);return lyr;
}

function refreshLeafletLayers(){
 if(!leafletTownMap)return;
 clearLeafletFeatureLayers();
 const addGroup=(key,features,mode)=>{
  const g=L.layerGroup();
  features.forEach(f=>{addFeatureGeoJSONToGroup(f,mode,g);});
  g.addTo(leafletTownMap);leafletFeatureLayers[key]=g;
 };
 if(townMapLayers.reference)addGroup('reference',referenceOverviewFeatures(),'reference');
 if(townMapLayers.details)addGroup('details',townMapFeatures.filter(f=>f.layer_code==='managed_forest'),'details');
 ['issues','owner_unknown','boundary_unknown'].forEach(mode=>{if(townMapLayers[mode])addGroup(mode,issueOverviewFeatures(mode),mode)});
 ['credit','candidate','program'].forEach(mode=>{if(townMapLayers[mode])addGroup(mode,townMapFeatures.filter(f=>f.layer_code==='managed_forest'&&managedMatchesFeature(f,mode)),mode)});
 if(townMapLayers.operations){
  const g=L.layerGroup();
  townWorkScopes.forEach(w=>addWorkScopeToGroup(w,g));
  g.addTo(leafletTownMap);leafletFeatureLayers.operations=g;
 }
 // 水系は森林面より前、災害記号より後ろ。森林との関係を読みやすくする。
 if(townMapLayers.water)addGroup('water',townMapFeatures.filter(f=>f.layer_code==='water_system'),'water');
 if(townMapLayers.disaster){
  addGroup('disaster-managed',townMapFeatures.filter(f=>f.layer_code==='managed_forest'&&managedMatchesFeature(f,'disaster')),'disaster');
  addGroup('disaster-events',townMapFeatures.filter(f=>f.layer_code==='hazard_area'),'disaster');
 }
 activeLayerLegend();
}
function setTownLayer(layer,checked){townMapLayers[layer]=checked;refreshLeafletLayers();}

function handleMapFeatureClick(f){
 if(f.layer_code==='forest_block_overview'){renderForestBlockOverviewDetail(f);return;}
 if(f.layer_code==='issue_overview'){renderIssueOverviewDetail(f);return;}
 if(f.layer_code==='reference_forest'){renderReferenceForestDetail(f);return;}
 if(f.layer_code==='managed_forest'){renderTownDetail(f.display_name);return;}
 if(f.layer_code==='unmanaged_group'){const id=featureProps(f).issue_area_id;if(id)renderIssueDetail(id);return;}
 if(f.layer_code==='water_system'){const p=featureProps(f);if(p.asset_id)renderWaterDetail(p.asset_id);else renderGenericWaterFeature(f);return;}
 if(f.layer_code==='hazard_area'){
  const p=featureProps(f),real=!f.is_fictional;
  document.getElementById('mapDetail').innerHTML=`<h2>${esc(f.display_name)}</h2><div class="map-summary-note">${real?'国土数値情報2025 奈良県の実データを、架空の青嶺町境界で切り出した参考表示です。法的図書ではありません。':'Forest OSデモ用の架空災害情報です。'}</div><div class="detailgrid"><div class="detailitem"><div class="k">種別</div><div class="v">${esc(f.feature_subtype||'—')}</div></div><div class="detailitem"><div class="k">面積</div><div class="v">${ha(f.area_ha)}</div></div><div class="detailitem"><div class="k">データ区分</div><div class="v">${real?'実データ参照 / 2025':'架空デモ'}</div></div><div class="detailitem"><div class="k">概要</div><div class="v">${esc(f.summary_text||'—')}</div></div></div>`;return;

function initLeafletTownMap(){
 if(!window.L)throw new Error('地図ライブラリを読み込めませんでした');
 if(leafletTownMap){leafletTownMap.remove();leafletTownMap=null;}
 leafletTownMap=L.map('leafletTownMap',{zoomControl:true,attributionControl:true,minZoom:9,maxZoom:15,preferCanvas:true});
 L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,maxNativeZoom:18,attribution:'背景地図：国土地理院 淡色地図'}).addTo(leafletTownMap);
 L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png',{maxZoom:16,maxNativeZoom:16,opacity:0.20,attribution:'陰影起伏：国土地理院'}).addTo(leafletTownMap);
 const boundary=townMapFeatures.find(f=>f.feature_code==='AOMINE-TOWN');
 if(boundary){
  const gj=geoObj(boundary.geom_geojson);
  const b=L.geoJSON(gj,{smoothFactor:3,style:{color:'#51635a',weight:1.15,opacity:.56,fillColor:'#6e8b73',fillOpacity:.012,dashArray:'7 7'}}).addTo(leafletTownMap);
  b.bindTooltip('【架空】青嶺町',{sticky:true});leafletFeatureLayers.town=b;leafletTownMap.fitBounds(b.getBounds(),{padding:[12,12]});
 }else leafletTownMap.setView([34.17,135.88],12);
}

 return `<div class="demo-note">デモ用の作業報告書イメージです。</div>
 <article class="docpaper">

 </article>`;
}
function openMock(ref){
 const modal=document.getElementById('viewer'),body=document.getElementById('viewerBody'),title=document.getElementById('viewerTitle');
 if(contractMocks[ref]){title.textContent='契約書';body.innerHTML=contractPaper(contractMocks[ref]);}
 else if(ref==='work-report'){title.textContent='作業報告書';body.innerHTML=workReport();}
 else if(['photo-before','photo-during','photo-after'].includes(ref)){title.textContent='作業写真';body.innerHTML=forestSvg(ref);}
 else{title.textContent='資料';body.innerHTML='<div class="empty">デモ資料を準備中です。</div>';}
 modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function closeViewer(){
 const modal=document.getElementById('viewer');modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';
}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-mock]');
 if(a){e.preventDefault();openMock(a.dataset.mock);}
 if(e.target?.id==='viewer')closeViewer();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();});

const loaders={municipality,forest_coop:forestCoop,forestry_company:forestryCompany,owner,accounting,jcredit:jcreditProject,pm,forest:forestView,town_map:townMap};
async function load(role){
 document.querySelectorAll('button[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));
 document.getElementById('cards').innerHTML='';
 document.getElementById('content').innerHTML='<div class="notice">読み込み中...</div>';
 try{await loaders[role]();document.getElementById('notice').textContent='公開デモ用Viewを表示中。本体DB・機密データは公開していません。'}
 catch(e){document.getElementById('notice').innerHTML=`<span class="warn">DB接続エラー：</span>${e.message}`;document.getElementById('content').innerHTML='<section><div class="empty">ネット接続またはSupabase側の公開設定を確認してください。</div></section>'}
}
document.querySelectorAll('button[data-role]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.role)));
load('municipality');
</script>
