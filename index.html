<!doctype html>
<!-- Forest OS v79 UI: regional forest portfolio + forest recovery + retained aggregation + unified project navigation -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest OS デモ｜管理コンソール</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7f5;--panel:#fff;--line:#dfe3df;--text:#1f2922;--muted:#66736a;--accent:#2f5d40;--soft:#eef3ef;--warn:#8b5a13}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
h1{margin:0;font-size:20px} .sub{margin-top:4px;color:var(--muted);font-size:12px}
nav{display:flex;gap:8px;overflow:auto;padding-top:12px}
button{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:8px;white-space:nowrap;font-size:14px}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:16px;max-width:1180px;margin:auto}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}
.card .label{font-size:12px;color:var(--muted)} .card .value{margin-top:5px;font-size:22px;font-weight:650}
section{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
section h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.tablewrap{overflow:auto} table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #edf0ed;vertical-align:top}
th{color:var(--muted);font-weight:600;background:#fafbfa}
.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--soft);font-size:11px}
.warn{color:var(--warn);font-weight:600} .empty{padding:14px;color:var(--muted);font-size:13px}
.footer{color:var(--muted);font-size:11px;padding:4px 2px 24px}
.selector{width:100%;max-width:520px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;margin-bottom:14px}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0}
.detailitem{padding:11px 14px;border-bottom:1px solid #edf0ed}
.detailitem .k{font-size:11px;color:var(--muted);margin-bottom:4px}
.detailitem .v{font-size:14px;line-height:1.45}


.doclink{color:#1f5f3b;text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer}
.doclink:hover{opacity:.75}
.entitylink{color:#1f5f3b;text-decoration:underline;text-underline-offset:3px;font-weight:650;cursor:pointer;background:none;border:0;padding:0;border-radius:0;font:inherit;white-space:normal;text-align:left}
.entitylink:hover{opacity:.72}
.entitytype{display:inline-block;margin-left:6px;padding:2px 6px;border:1px solid #d7dfd8;border-radius:999px;background:#f3f6f3;color:#5e6b62;font-size:10px;font-weight:600;vertical-align:1px}
.partyhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.partyname{font-size:20px;font-weight:750;line-height:1.35}
.partygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;margin-bottom:14px}
.partygrid>div{padding:11px 12px;border-right:1px solid #edf0ed;border-bottom:1px solid #edf0ed}
.partygrid .k{font-size:11px;color:var(--muted);margin-bottom:4px}.partygrid .v{font-size:13px;line-height:1.5}
.partysection{background:#fff;border:1px solid var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.partysection h4{font-family:inherit;font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.partysection .rows{padding:4px 12px}
.partyrow{padding:8px 0;border-bottom:1px solid #edf0ed;font-size:13px;line-height:1.5}.partyrow:last-child{border-bottom:0}
.partyactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(20,28,23,.58);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow:auto}
.modal.open{display:flex}
.viewerbox{width:min(900px,100%);background:#f4f5f2;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.25);overflow:hidden}
.viewerhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:11px 14px}
.viewerhead strong{font-size:14px}
.closebtn{font-size:13px;padding:7px 11px}
.viewerbody{padding:16px}
.demo-note{font-size:12px;color:var(--muted);margin-bottom:10px}
.docpaper{max-width:720px;margin:0 auto;background:#fff;min-height:720px;padding:42px 46px;border:1px solid #d6d9d6;box-shadow:0 5px 18px rgba(0,0,0,.08);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.9}
.docpaper h3{text-align:center;font-size:22px;margin:4px 0 28px}
.docpaper .meta{font-size:13px;margin:8px 0 22px}
.docpaper h4{font-size:15px;margin:20px 0 5px}
.docpaper p{font-size:14px;margin:4px 0}
.signature{margin-top:40px;border-top:1px solid #ddd;padding-top:18px}
.mockphoto{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);padding:12px}
.mockphoto svg{display:block;width:100%;height:auto;background:#dfe9e1}
.photometa{font-size:12px;color:var(--muted);padding:10px 2px 2px}



.layergroups{display:flex;flex-direction:column;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfa}
.layergroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;overflow:visible}
.layergrouptitle{font-size:10px;font-weight:700;color:#5c675f;min-width:56px}
.layercheck.water-toggle{border-color:#7caac0;background:#f3f9fc;font-weight:700}
.layercheck.water-toggle:has(input:checked){background:#dceef6;border-color:#4d8eab}
.layercheck.reference-toggle{border-color:#9caf9b;background:#f3f7f2;font-weight:700}
.layercheck.reference-toggle:has(input:checked){background:#e4eee2;border-color:#6f8f72}
@media(max-width:600px){
 .layergroups{padding:8px}
 .layergroup{gap:5px}
 .layergrouptitle{width:100%;min-width:0;margin-top:2px}
 .layercheck{font-size:10px;padding:5px 7px}
}

.layerbar{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfa}
.layercheck{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;user-select:none}
.layercheck input{margin:0}
.layercheck:has(input:checked){background:#eef5ef;border-color:#a5bda9;box-shadow:inset 0 0 0 1px rgba(86,118,92,.05)}
.mapaction{padding:12px 14px;border-top:1px solid var(--line)}
.primarybtn{border:1px solid #2f6b45;background:#2f6b45;color:#fff;border-radius:7px;padding:9px 12px;font-size:13px;font-weight:650;cursor:pointer;width:100%}
.primarybtn:hover{opacity:.88}
.map-summary-note{font-size:11px;color:var(--muted);padding:0 14px 10px}

.maplayout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:12px;margin-bottom:14px}
.mapsection{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.maphead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.maphead strong{font-size:14px}.maphead span{font-size:11px;color:var(--muted)}
.mapcanvas{position:relative;background:#eef2eb;min-height:560px;overflow:hidden}
#leafletTownMap{height:610px;width:100%;background:#eef2eb}.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:9px}.map-source-note{font-size:10px;color:var(--muted);line-height:1.45}
.activelegend{position:absolute;left:10px;bottom:10px;z-index:450;background:rgba(255,255,255,.93);backdrop-filter:blur(4px);border:1px solid rgba(150,160,153,.45);border-radius:9px;padding:8px 9px;box-shadow:0 3px 14px rgba(0,0,0,.08);max-width:190px;font-size:10px;line-height:1.45}.activelegend strong{display:block;font-size:10px;margin-bottom:4px;color:#425048}.activelegend .legendrow{margin:2px 0}.activelegend .swatch.line{height:3px;border-radius:999px;border:0}.activelegend .swatch.dash{height:0;border:0;border-top:2px dashed currentColor;background:transparent;border-radius:0}.mapmodebadge{font-size:10px;color:#496253;background:#eef4ef;border:1px solid #cad8cd;border-radius:999px;padding:3px 7px;white-space:nowrap}
.maplegend{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:10px;line-height:1.65;z-index:2;max-width:190px}
.legendrow{display:flex;align-items:center;gap:6px;white-space:nowrap}.swatch{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.mapdetail{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mapdetail h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.mapdetail .detailgrid{grid-template-columns:1fr}
.maplabel{font-size:11px;font-weight:650;fill:#243028;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.maparea{cursor:pointer;transition:opacity .15s,stroke-width .15s}.maparea:hover{opacity:.82;stroke-width:3}
.detailarea{cursor:pointer;stroke-width:3}.detailarea:hover{stroke-width:5}
.map-note{font-size:11px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:#fafbfa}
.map-region-notice{margin:8px 12px 0;padding:10px 12px;border:1px solid #d8e0dc;border-radius:10px;background:#f7faf8;font-size:13px;line-height:1.65}.map-region-notice strong{display:block;margin-bottom:2px}.map-region-notice.is-hidden{display:none}.map-region-notice .mini{color:#627168;font-size:12px}

.statusline{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.statuspill{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}

.coveragebar{height:7px;background:#edf0ed;border-radius:999px;overflow:hidden;margin-top:5px}.coveragebar>span{display:block;height:100%;background:#6f8f72}.coveragegrid{display:flex;gap:4px;flex-wrap:wrap}.covchip{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:#fff}.cov-confirmed{background:#e8f1e9;border-color:#aac0ad}.cov-partial{background:#f6f0df;border-color:#d9c58d}.cov-unknown,.cov-not_available{background:#f1f1f1;color:#69716b}.cov-not_applicable{background:#eef3f7;color:#536b7b}.smallnote{font-size:11px;color:var(--muted);line-height:1.5}.density{font-weight:700}.density-濃い{color:#2f6b45}.density-標準{color:#5e7245}.density-薄い{color:#8b6f47}.density-要整理{color:#8b4e4e}
@media(max-width:800px){.maplayout{grid-template-columns:1fr}.mapcanvas{min-height:540px}.maplegend{max-width:170px}#leafletTownMap{height:620px}.activelegend{max-width:170px;left:8px;bottom:8px}}

@media(max-width:600px){.viewerbody{padding:8px}.docpaper{padding:28px 20px;min-height:620px}.docpaper h3{font-size:19px}}

@media(max-width:600px){header{padding:14px 12px 10px}main{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}.card .value{font-size:18px}}

/* v55 PM mobile-first project/task/contract cards */
.pmcardlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;padding:12px}
.pmprojcard,.pmtaskcard,.pmcontractcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;min-width:0}
.pmprojhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.pmprojtitle{font-size:14px;font-weight:750;line-height:1.45;min-width:0}.pmprojcode{font-size:10px;color:var(--muted);margin-top:3px}
.pmchips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 10px}.pmchip{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:10px;line-height:1.3}.pmchip.strong{background:#e5efe7;border-color:#bfd0c3;color:#28583a;font-weight:700}.pmchip.readonly{background:#f4f4f4;color:#687169}
.pmkv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #edf0ed}.pmkv>div{padding:8px 6px 7px 0;min-width:0}.pmkv .k{font-size:10px;color:var(--muted);margin-bottom:3px}.pmkv .v{font-size:12px;line-height:1.45;overflow-wrap:anywhere}.pmkv .wide{grid-column:1/-1}
.pmtasktitle,.pmcontracttitle{font-size:13px;font-weight:700;line-height:1.45;margin-bottom:5px}.pmcardnote{font-size:11px;color:var(--muted);line-height:1.55;margin-top:7px}.pmduedate{font-weight:700}.pmduedate.overdue{color:var(--warn)}
.pmempty{padding:14px;color:var(--muted);font-size:13px}
@media(max-width:620px){.pmcardlist{grid-template-columns:1fr;padding:10px}.pmprojcard,.pmtaskcard,.pmcontractcard{padding:11px}.pmkv{grid-template-columns:1fr 1fr}}


.river-permanent-label{background:rgba(255,255,255,.90)!important;border:0!important;box-shadow:none!important;color:#4f7f97!important;font-size:10px!important;font-weight:700!important;padding:1px 4px!important;border-radius:4px!important}
.river-permanent-label:before{display:none!important}

/* v20 visibility-first map tuning */
#leafletTownMap{filter:saturate(.92) contrast(1.03)}
.activelegend{background:rgba(255,255,255,.96);font-size:10.5px}
@media(max-width:600px){
 #leafletTownMap{height:640px}
 .activelegend{max-width:158px;padding:7px 8px}
}

.ownerchip,.sourcechip{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;background:#eef3ef;border:1px solid #d8e2d9}
.sourcechip.external{background:#f8f1e6;border-color:#ead7b8;color:#72521e}.sourcechip.internal{background:#edf3f7;border-color:#cfdee8;color:#385a70}.sourcechip.mixed{background:#f3eff7;border-color:#ddd0e9;color:#654c79}
.stage-initial{background:#dfeee3}.stage-addition{background:#e9f2eb}.stage-candidate{background:#fbf0dd;color:#7d571d}
.rowfocus{outline:2px solid #c58a2d;outline-offset:-2px;background:#fff8eb!important}.mapjump{border:1px solid #bfd0c3;background:#f6faf7;color:#28583a;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer}.mapjump:hover{background:#eef6f0}.mapactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:12px 14px;border-top:1px solid var(--line)}.mapactions .primarybtn{width:auto}.secondarybtn{border:1px solid #b9c8bd;background:#fff;color:#315440;border-radius:7px;padding:9px 12px;font-size:13px;font-weight:650;cursor:pointer}
.mapmodebadge{font-size:11px;color:#44554a;background:#eef3ef;border:1px solid #dce6de;border-radius:999px;padding:4px 8px}
.project-note{padding:9px 12px;font-size:12px;color:#56645b;background:#f8faf8;border-top:1px solid #edf0ed}

/* v23 independent map filters */
.mapfilters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.filterbox{min-width:0}
.filterbox label{display:block;font-size:10px;font-weight:700;color:#5d695f;margin:0 0 4px 2px}
.filterbox select,.projectfilter summary{width:100%;height:36px;border:1px solid #d9dfda;border-radius:7px;background:#fff;padding:0 9px;font-size:12px;color:#26312a}
.filterbox select{appearance:auto}
.projectfilter{position:relative}
.projectfilter summary{display:flex;align-items:center;cursor:pointer;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projectfilter summary::-webkit-details-marker{display:none}
.projectfilter[open] summary{border-color:#91aa96}
.projectmenu{position:absolute;top:40px;left:0;z-index:800;width:min(340px,85vw);background:#fff;border:1px solid #d6ddd7;border-radius:8px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.13)}
.projectmenu button{width:100%;text-align:left;padding:7px 8px;margin-bottom:4px;font-size:12px}
.projectmenu label{display:flex;align-items:flex-start;gap:7px;padding:7px 5px;margin:0;font-size:12px;font-weight:500;cursor:pointer;border-radius:5px}
.projectmenu label:hover{background:#f4f7f4}
.projectmenu input{margin-top:2px}
.filterhint{grid-column:1/-1;font-size:10px;color:var(--muted);padding:0 2px 1px}
@media(max-width:800px){.mapfilters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.mapfilters{grid-template-columns:1fr 1fr;gap:7px}.filterbox select,.projectfilter summary{font-size:11px;height:35px}.projectmenu{position:fixed;left:12px;right:12px;top:auto;width:auto}}


/* v25 admin / planning / work schedule */
.admin-toolbar{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:visible}
.admin-toolbar-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line)}
.admin-toolbar-head strong{font-size:14px}.admin-toolbar-head span{font-size:11px;color:var(--muted);line-height:1.45}
.admin-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:11px 12px}
.admin-filter label,.context-select label,.planfield label{display:block;font-size:10px;font-weight:700;color:#5d695f;margin:0 0 4px 2px}
.admin-filter select,.context-select select,.planfield select,.planfield input,.agg-controls select,.planrow select,.planrow input,.workfilter select{width:100%;height:36px;border:1px solid #d9dfda;border-radius:7px;background:#fff;padding:0 9px;font-size:12px;color:#26312a}
.admin-filter .projectfilter summary{height:36px;font-size:12px}
.admin-filter-actions{display:flex;gap:7px;align-items:flex-end}.admin-filter-actions button{height:36px;padding:0 11px}
.scope-line{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}.scope-chip{font-size:10px;padding:3px 7px;border-radius:999px;border:1px solid #d9e1da;background:#f6f9f6;color:#44554a}
.admin-modebar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.admin-modebar button{font-size:12px;padding:7px 11px}.admin-modebar button.active{background:#425f4b;color:#fff;border-color:#425f4b}
.admin-map-placeholder{min-height:260px;background:linear-gradient(145deg,#eef4ee,#f8faf7);display:flex;align-items:center;justify-content:center;padding:22px;border-top:1px solid #edf0ed}
.admin-map-inner{max-width:620px;text-align:center}.admin-map-inner strong{font-size:17px}.admin-map-inner p{font-size:12px;color:var(--muted);line-height:1.7}.admin-map-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.agg-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);background:#fafbfa;align-items:end}.agg-controls label{display:block;font-size:10px;font-weight:700;color:#5d695f;margin:0 0 4px 2px}.agg-controls button{height:36px}
.barcell{min-width:180px}.bartrack{height:7px;background:#edf0ed;border-radius:999px;overflow:hidden;margin-top:5px}.bartrack span{display:block;height:100%;background:#748f79}
.contextbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:12px}.context-note{grid-column:1/-1;font-size:10px;color:var(--muted)}

.plan-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line);background:#fafbfa}.plan-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.plan-kpi{border:1px solid #e5e9e5;border-radius:7px;padding:8px;background:#fff}.plan-kpi .k{font-size:10px;color:var(--muted)}.plan-kpi .v{font-size:15px;font-weight:700;margin-top:3px}

let authRefreshTimer=null,authRefreshPromise=null;
function readStoredAuthSession(){
 try{
  const local=localStorage.getItem(AUTH_SESSION_KEY);
  if(local)return JSON.parse(local);
  const legacy=sessionStorage.getItem(AUTH_SESSION_KEY);
  if(legacy){localStorage.setItem(AUTH_SESSION_KEY,legacy);sessionStorage.removeItem(AUTH_SESSION_KEY);return JSON.parse(legacy);}
 }catch(_){ }
 return null;
}
let authSession=readStoredAuthSession();
function authToken(){return authSession?.access_token||null;}
function authExpiryEpoch(){
 const direct=Number(authSession?.expires_at||0);if(direct)return direct;
 const token=authToken();if(!token)return 0;
 try{const part=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const payload=JSON.parse(atob(part.padEnd(Math.ceil(part.length/4)*4,'=')));return Number(payload.exp||0);}catch(_){return 0;}
}
function normalizeAuthSession(v,prior=authSession){
 if(!v||!v.access_token)return null;
 const expires_at=Number(v.expires_at||0)||(v.expires_in?Math.floor(Date.now()/1000)+Number(v.expires_in):Number(prior?.expires_at||0)||null);
 return {access_token:v.access_token,refresh_token:v.refresh_token||prior?.refresh_token||null,expires_at};
}
function scheduleAuthRefresh(){
 if(authRefreshTimer){clearTimeout(authRefreshTimer);authRefreshTimer=null;}
 if(!authSession?.refresh_token)return;
 const exp=authExpiryEpoch();if(!exp)return;
 const delay=Math.max(30000,Math.min(2140000000,exp*1000-Date.now()-120000));
 authRefreshTimer=setTimeout(()=>{refreshAuthSession(false).catch(()=>{});},delay);
}
function saveAuthSession(v){

 }catch(_){ }

}

async function refreshAuthSession(force=false){
 if(authRefreshPromise)return authRefreshPromise;
 if(!authSession?.refresh_token)return false;
 const exp=authExpiryEpoch();
 if(!force&&exp&&exp>Math.floor(Date.now()/1000)+180){scheduleAuthRefresh();return true;}
 authRefreshPromise=(async()=>{
  try{
   const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authSession.refresh_token})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.access_token){
    if(r.status===400||r.status===401){saveAuthSession(null);return false;}
    throw new Error(String(j?.message||`session refresh: ${r.status}`));
   }
   saveAuthSession(normalizeAuthSession(j,authSession));return true;
  }finally{authRefreshPromise=null;}
 })();
 return authRefreshPromise;
}
async function ensureAuthSession(){
 if(!authToken())throw new Error('再ログインが必要です');
 const exp=authExpiryEpoch();
 if(exp&&exp<=Math.floor(Date.now()/1000)+120){
  const ok=await refreshAuthSession(true);if(!ok)throw new Error('ログインの有効期限が切れました。画面上部から再ログインしてください。');
 }

}
async function rpcRaw(fn,body,token){
 const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>null);return {r,j};
}
async function rpc(fn,body={}){
 let token=await ensureAuthSession();let out=await rpcRaw(fn,body,token);
 let msg=String((out.j&&out.j.message)||'');
 if(!out.r.ok&&(out.r.status===401||/jwt|token|expired/i.test(msg))){
  let refreshed=false;
  try{refreshed=await refreshAuthSession(true);}catch(_){throw new Error('認証セッションの更新に一時的に失敗しました。通信を確認してもう一度お試しください。');}
  if(refreshed){token=authToken();out=await rpcRaw(fn,body,token);msg=String((out.j&&out.j.message)||'');}
  else throw new Error('ログインの有効期限が切れました。画面上部から再ログインしてください。');
 }
 if(!out.r.ok){
  if(out.r.status===401||/jwt|token|expired/i.test(msg)){saveAuthSession(null);throw new Error('ログインの有効期限が切れました。画面上部から再ログインしてください。');}
  throw new Error(msg||`${fn}: ${out.r.status}`);
 }
 return out.j;
}

}
async function q(view,params='select=*'){

  // logged in; authenticated production access and writes use rpc() below.
  // This prevents a valid Auth session from being applied to demo-only views
  // whose grants intentionally differ from production Access Scope.
  const r=await fetch(`${SB_URL}/rest/v1/${view}?${qp}`,{headers:{apikey:SB_KEY}});
  if(!r.ok)throw new Error(`${view}: ${r.status}`);
  return r.json();
 };

 const target=`viewer_name=eq.${encodeURIComponent(PM_UNIFIED_PARTY)}`;
 // Stable/current read views are already canonicalized to the unified PM party.
 // Legacy-name fallback is only for old demo snapshot tables/views that still retain the former PM name.
 const canonicalRead=String(view||'').startsWith('forest_os_ui_')||String(view||'').startsWith('forest_os_current_')||String(view||'').startsWith('forest_os_canonical_');
 if(!canonicalRead&&currentPm?.id==='pm_integrated'&&typeof params==='string'&&params.includes(target)){
  const merged=[];
  for(const name of PM_QUERY_PARTIES){
   const rows=await fetchJson(params.replace(target,`viewer_name=eq.${encodeURIComponent(name)}`));
   merged.push(...rows);
  }
  const normalized=normalizeDemoData(merged);
  const seen=new Set();
  return normalized.filter(row=>{
   const clone=(row&&typeof row==='object')?{...row}:row;
   if(clone&&typeof clone==='object')delete clone.viewer_name;
   const key=JSON.stringify(clone);
   if(seen.has(key))return false;
   seen.add(key);
   return true;
  });
 }
 return normalizeDemoData(await fetchJson(params));
}

function speciesLabel(s){
 if(!s)return '—';
 try{
   const a=Array.isArray(s)?s:(typeof s==='string'?JSON.parse(s):[s]);
   return a.map(x=>{
     if(typeof x==='string')return x;
     const name=x?.species_name||x?.species||x?.name||x?.label||x?.tree_species||'樹種未設定';
     const raw=x?.ratio??x?.share??x?.percentage;
     const ratio=raw==null?'':` ${Number(raw)<=1?Math.round(Number(raw)*100):Math.round(Number(raw))}%`;
     return `${name}${ratio}`;
   }).filter(Boolean).join(' / ')||'—';
 }catch(e){return typeof s==='string'?s:'—';}
}

// 町全体マップは精密境界ではなく概況把握を優先する。
// 正本の100mメッシュ／課題形状はDBに保持し、表示時だけブロック単位の外周へ一般化する。
function collectGeoPoints(gj){
 const pts=[];
 const walk=x=>{
  if(Array.isArray(x)&&x.length>=2&&typeof x[0]==='number'&&typeof x[1]==='number'){pts.push([x[0],x[1]]);return;}
  if(Array.isArray(x))x.forEach(walk);
 };
 if(gj&&gj.coordinates)walk(gj.coordinates);
 return pts;
}
function convexHull(points){
 const uniq=[...new Map(points.map(p=>[`${p[0].toFixed(7)},${p[1].toFixed(7)}`,p])).values()];
 if(uniq.length<3)return uniq;
 uniq.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
 const lower=[]; for(const p of uniq){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);}
 const upper=[]; for(let i=uniq.length-1;i>=0;i--){const p=uniq[i];while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);}
 const hull=lower.slice(0,-1).concat(upper.slice(0,-1));
 if(hull.length)hull.push(hull[0]);
 return hull;
}
function townBoundaryBBox(){
 const b=townMapFeatures.find(f=>f.feature_code==='AOMINE-TOWN');
 const pts=b?collectGeoPoints(geoObj(b.geom_geojson)):[];
 if(!pts.length)return {minLon:135.82,maxLon:135.95,minLat:34.118,maxLat:34.24};
 return {minLon:Math.min(...pts.map(p=>p[0])),maxLon:Math.max(...pts.map(p=>p[0])),minLat:Math.min(...pts.map(p=>p[1])),maxLat:Math.max(...pts.map(p=>p[1]))};
}
function townBlockPointExtent(){
 const pts=[];
 townBlocks.forEach(b=>parseParts(b.map_parts).forEach(part=>String(part.points||'').trim().split(/\s+/).forEach(pair=>{
  const [x,y]=pair.split(',').map(Number);if(Number.isFinite(x)&&Number.isFinite(y))pts.push([x,y]);
 })));
 if(!pts.length)return {minX:0,maxX:1000,minY:0,maxY:700};
 return {minX:Math.min(...pts.map(p=>p[0])),maxX:Math.max(...pts.map(p=>p[0])),minY:Math.min(...pts.map(p=>p[1])),maxY:Math.max(...pts.map(p=>p[1]))};
}
function blockPartToRing(pointsText){
 const box=townBoundaryBBox(), ext=townBlockPointExtent();
 const padX=(box.maxLon-box.minLon)*.035,padY=(box.maxLat-box.minLat)*.035;
 const minLon=box.minLon+padX,maxLon=box.maxLon-padX,minLat=box.minLat+padY,maxLat=box.maxLat-padY;
 const arr=String(pointsText||'').trim().split(/\s+/).map(pair=>pair.split(',').map(Number)).filter(a=>a.length===2&&a.every(Number.isFinite));
 const ring=arr.map(([x,y])=>{
  const nx=(x-ext.minX)/Math.max(1,ext.maxX-ext.minX), ny=(y-ext.minY)/Math.max(1,ext.maxY-ext.minY);
  return [minLon+nx*(maxLon-minLon), maxLat-ny*(maxLat-minLat)];
 });
 if(ring.length&& (ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1]))ring.push([...ring[0]]);
 return ring;
}
function blockFeature(block,mode,issueIds=[]){

 const rows=townIssues.filter(x=>issueIds.includes(x.issue_area_id));

function addFeatureGeoJSONToGroup(f,mode,group){
 const managedShapeModes=['details','municipal','credit','candidate','program','disaster'];
 const gj=(mode==='water')?displayWaterGeometry(f):((f.layer_code==='managed_forest'&&managedShapeModes.includes(mode))?managedDisplayGeometry(f):geoObj(f.geom_geojson));if(!gj)return null;const color=layerColor(mode);
 const subtype=String(f.feature_subtype||'');
 const props=featureProps(f);
 const isWater=mode==='water';
 let fillOpacity=.12,weight=0,dashArray=null,opacity=.62,smoothFactor=3.4;
 // v20 視認性優先：町全体では内部境界を描かず、面の意味だけを残す。
 // 正本GISの細かさはDBに保持し、通常画面では地形とテーマが読めることを優先する。
 if(mode==='reference'){fillOpacity=.035;weight=0;opacity=0;smoothFactor=4.8;}
 if(mode==='details'){fillOpacity=.12;weight=.95;opacity=.82;smoothFactor=1.2;}
 if(mode==='municipal'){fillOpacity=0;weight=2.2;opacity=.96;dashArray='10 5';smoothFactor=3.8;}
 if(mode==='issues'){fillOpacity=.105;weight=0;opacity=0;smoothFactor=4.4;}
 if(mode==='owner_unknown'){fillOpacity=.055;weight=.45;opacity=.26;dashArray='3 7';smoothFactor=4.4;}
 if(mode==='boundary_unknown'){fillOpacity=0;weight=.72;opacity=.42;dashArray='7 8';smoothFactor=4.4;}
 if(mode==='credit'){fillOpacity=props.participation_stage==='initial'?.34:.25;weight=props.participation_stage==='initial'?1.35:1.15;opacity=.96;dashArray=props.participation_stage==='addition'?'2 3':null;smoothFactor=1.2;}
 if(mode==='candidate'){fillOpacity=.22;weight=1.35;opacity=.98;dashArray='7 5';smoothFactor=1.2;}
 if(mode==='program'){fillOpacity=.22;weight=1.15;opacity=.92;smoothFactor=1.2;}
 if(mode==='disaster'){fillOpacity=f.is_fictional ? .12 : .065;weight=f.is_fictional ? 1.0 : .7;opacity=.78;smoothFactor=1.2;}

 // 水系は「青い線」ではなく、淡い河道＋芯線で河川らしく見せる。
 // DBの実データを使う本番でも同じ描画方式を流用できる。
 if(isWater && (subtype==='river' || subtype==='tributary')){
   const isMain=subtype==='river';
   const halo=L.geoJSON(gj,{
     smoothFactor:1.0,
     style:()=>({color:isMain?'#cfe7f1':'#dcecf3',weight:isMain?4.1:2.8,opacity:isMain?.46:.34,lineCap:'round',lineJoin:'round'}),
     onEachFeature:(feature,layer)=>{layer.on('click',()=>handleMapFeatureClick(f));if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});}
   });
   halo.addTo(group);
   const core=L.geoJSON(gj,{
     smoothFactor:1.0,
     style:()=>({color:isMain?'#4f8daa':'#78a9bd',weight:isMain?1.35:.90,opacity:isMain?.88:.70,lineCap:'round',lineJoin:'round'}),
     onEachFeature:(feature,layer)=>{
       layer.on('click',()=>handleMapFeatureClick(f));
       if(f.feature_code==='RIVER-MID'){layer.bindTooltip('青嶺川',{permanent:true,direction:'center',className:'river-permanent-label'});}
       else if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});
     }
   });
   core.addTo(group);return core;
 }

 if(isWater){
   opacity=.72;smoothFactor=2.0;
   if(['watershed','catchment'].includes(subtype)){fillOpacity=.006;weight=.45;opacity=.14;dashArray='4 10';}
   else if(['reservoir','lake','dam_lake'].includes(subtype)){fillOpacity=.34;weight=.8;opacity=.68;}
   else if(subtype==='dam'){fillOpacity=.06;weight=.7;opacity=.64;}
   else if(subtype==='water_source'){fillOpacity=.06;weight=.65;opacity=.58;}
   else {fillOpacity=.04;weight=.55;opacity=.50;}
 }
 const lyr=L.geoJSON(gj,{
  smoothFactor,
  style:()=>({color,weight,opacity,fillColor:isWater&&['reservoir','lake','dam_lake'].includes(subtype)?'#8fc5dc':color,fillOpacity,dashArray,lineCap:'round',lineJoin:'round'}),
  pointToLayer:(feature,latlng)=>L.circleMarker(latlng,{radius:subtype==='dam'?3.2:subtype==='water_source'?2.7:3.5,color:'#fff',weight:1,fillColor:color,fillOpacity:.78}),
  onEachFeature:(feature,layer)=>{layer.on('click',()=>handleMapFeatureClick(f));if(f.display_name)layer.bindTooltip(f.display_name,{sticky:true,direction:'top'});}
 });
 lyr.addTo(group);return lyr;
}

function refreshLeafletLayers(){
 if(!leafletTownMap)return;
 clearLeafletFeatureLayers();
 const addGroup=(key,features,mode)=>{
  const g=L.layerGroup();
  features.forEach(f=>{addFeatureGeoJSONToGroup(f,mode,g);});
  g.addTo(leafletTownMap);leafletFeatureLayers[key]=g;
 };
 if(townMapLayers.details)addCanonicalGroup('details','forest','details');
 if(townMapLayers.parcel_boundary)addCanonicalGroup('parcel_boundary','parcel','parcel_boundary');
 ['issues','owner_unknown','boundary_unknown'].forEach(mode=>{if(townMapLayers[mode]&&mapLayerAllowedForPersona(mode))addGroup(mode,issueOverviewFeatures(mode),mode)});
 if(townMapLayers.municipal&&mapLayerAllowedForPersona('municipal'))addGroup('municipal',townMapFeatures.filter(f=>f.layer_code==='managed_forest'&&managedMatchesFeature(f,'municipal')&&passesMapFilters(f)),'municipal');
 if(townMapLayers.credit)addCanonicalGroup('credit','jcredit_scope','credit');
 ['candidate','program'].forEach(mode=>{if(townMapLayers[mode])addGroup(mode,townMapFeatures.filter(f=>f.layer_code==='managed_forest'&&managedMatchesFeature(f,mode)&&passesMapFilters(f)),mode)});
 if(townMapLayers.operations)addCanonicalGroup('operations','work','operations');
 // 水系は森林面より前、災害記号より後ろ。森林との関係を読みやすくする。
 if(townMapLayers.water)addGroup('water',townMapFeatures.filter(f=>f.layer_code==='water_system'),'water');
 if(townMapLayers.disaster&&mapLayerAllowedForPersona('disaster')){
  addCanonicalGroup('disaster-events','incident','disaster');
 }
 activeLayerLegend();
}

function buildAdminAreaMap(growth,activities,projects,mapRows){
 const m=new Map();
 for(const x of growth||[]) if(x.forest_name&&x.eligible_area_ha!=null)m.set(x.forest_name,Number(x.eligible_area_ha));
 for(const x of activities||[]) if(x.forest_name&&x.eligible_area_ha!=null)m.set(x.forest_name,Number(x.eligible_area_ha));
 for(const r of mapRows||[]) if(r.forest_name&&r.area_ha!=null&&!m.has(r.forest_name))m.set(r.forest_name,Number(r.area_ha));
 for(const p of projects||[]){
   const matches=(mapRows||[]).filter(r=>safeArr(r.project_codes).includes(p.project_code));
   if(matches.length===1 && p.target_area_ha!=null && !m.has(matches[0].forest_name))m.set(matches[0].forest_name,Number(p.target_area_ha));
 }
 return m;
}

function adminToggleProject(code,checked){if(checked)adminState.projects.add(code);else adminState.projects.delete(code);adminUpdateProjectSummary();adminRender();}

function projectPartyMatches(row,party){
 if(party==='*')return true;
 return safeArr(row.project_codes).some(c=>{const p=adminData.projectByCode.get(c);return p&&(p.project_owner_name===party||p.implementing_party_name===party);});
}
function forestPartyMatches(row){
 const party=adminState.party,role=adminState.partyRole;if(party==='*')return true;
 if(role==='owner')return safeArr(row.owner_names).includes(party);
 if(role==='manager')return safeArr(row.manager_names).includes(party);
 if(role==='operator')return safeArr(row.work_operator_names).includes(party);
 if(role==='project')return projectPartyMatches(row,party);
 if(role==='agent')return (adminData.delegations||[]).some(d=>d.delegate_name===party&&String(d.forest_unit_id)===String(row.forest_unit_id));
 if(role==='vendor')return true; // vendor is applied to cost aggregation; do not hide unrelated forest map rows.
 return [...safeArr(row.owner_names),...safeArr(row.manager_names),...safeArr(row.work_operator_names)].includes(party)||projectPartyMatches(row,party)||(adminData.delegations||[]).some(d=>d.delegate_name===party&&String(d.forest_unit_id)===String(row.forest_unit_id));
}
function personaAllowsForest(row){
 const p=currentPersona();if(p.kind==='admin')return true;
 if(p.kind==='municipality')return !p.region||row.region_name===p.region;
 if(p.kind==='forest_coop')return [...safeArr(row.manager_names),...safeArr(row.work_operator_names)].includes(p.party)||projectPartyMatches(row,p.party);
 if(p.kind==='forestry_company')return safeArr(row.work_operator_names).includes(p.party)||(adminData.works||[]).some(w=>w.responsible_party_name===p.party&&w.forest_name===row.forest_name);
 if(p.kind==='pm')return projectPartyMatches(row,p.party);
 if(p.kind==='owner')return safeArr(row.owner_names).includes(p.party);
 if(p.kind==='owner_proxy')return (adminData.delegations||[]).some(d=>d.delegate_name===p.party&&String(d.forest_unit_id)===String(row.forest_unit_id));
 return true;
}
function adminFilteredForests(){
 return (adminData.mapRows||[]).filter(r=>{
  if(!personaAllowsForest(r))return false;
  if(adminState.region!=='*'&&r.region_name!==adminState.region)return false;
  if(adminState.projects.size&&!safeArr(r.project_codes).some(c=>adminState.projects.has(c)))return false;
  if(!forestPartyMatches(r))return false;
  if(adminState.workType!=='*'){
   const names=new Set((adminData.works||[]).filter(w=>w.work_type_name===adminState.workType).map(w=>w.forest_name));
   if(!names.has(r.forest_name))return false;
  }
  return true;
 });
}

}

function adminGroupRecords(forests,projects,works,costs){
 const g=new Map();const ensure=k=>{if(!g.has(k))g.set(k,{key:k,forestSet:new Set(),projectSet:new Set(),forest_area:0,work_count:0,work_area:0,planned_cost:0,issued:0,available:0});return g.get(k)};
 const addForest=(key,r)=>{const z=ensure(key);if(!z.forestSet.has(r.forest_unit_id)){z.forestSet.add(r.forest_unit_id);z.forest_area+=Number(adminData.areaByForest.get(r.forest_name)||0)}safeArr(r.project_codes).forEach(c=>z.projectSet.add(c));};
 if(adminState.groupBy==='region')forests.forEach(r=>addForest(r.region_name||'未設定',r));
 if(adminState.groupBy==='project')forests.forEach(r=>safeArr(r.project_codes).forEach((c,i)=>addForest(safeArr(r.project_names)[i]||c,r)));
 if(adminState.groupBy==='party')forests.forEach(r=>{
   let names=[];const agents=(adminData.delegations||[]).filter(d=>String(d.forest_unit_id)===String(r.forest_unit_id)).map(d=>d.delegate_name);if(adminState.partyRole==='owner')names=safeArr(r.owner_names);else if(adminState.partyRole==='manager')names=safeArr(r.manager_names);else if(adminState.partyRole==='operator')names=safeArr(r.work_operator_names);else if(adminState.partyRole==='agent')names=agents;else names=uniq([...safeArr(r.owner_names),...safeArr(r.manager_names),...safeArr(r.work_operator_names),...agents]);
   names.forEach(n=>addForest(n,r));
 });
 if(adminState.groupBy==='role')forests.forEach(r=>{safeArr(r.owner_names).forEach(_=>addForest('地権者',r));safeArr(r.manager_names).forEach(_=>addForest('管理者',r));safeArr(r.work_operator_names).forEach(_=>addForest('施業者',r));(adminData.delegations||[]).filter(d=>String(d.forest_unit_id)===String(r.forest_unit_id)).forEach(_=>addForest('管理代理',r));});
 if(adminState.groupBy==='work_type')works.forEach(w=>{const z=ensure(w.work_type_name||'未設定');z.work_count++;z.work_area+=Number(w.planned_area_ha||w.actual_area_ha||0)});
 if(adminState.groupBy==='year'){

   costs.forEach(c=>ensure(String(c.forecast_year||'未設定')).planned_cost+=Number(c.amount_jpy||0));
 }
 // Add direct project metrics to project groups; otherwise apportion by membership only where the project name is the group.
 projects.forEach(p=>{if(adminState.groupBy==='project'){const z=ensure(p.name);z.projectSet.add(p.project_code);z.issued+=Number(p.issued_quantity_t||0);z.available+=Number(p.available_quantity_t||0)}});
 if(adminState.groupBy==='party')costs.filter(c=>c.vendor).forEach(c=>ensure(c.vendor).planned_cost+=Number(c.amount_jpy||0));
 if(adminState.groupBy==='year'){} else if(adminState.groupBy==='work_type'){} else if(adminState.groupBy==='region'&&g.size===1){[...g.values()][0].planned_cost=costs.reduce((s,c)=>s+Number(c.amount_jpy||0),0);[...g.values()][0].issued=projects.reduce((s,p)=>s+Number(p.issued_quantity_t||0),0);[...g.values()][0].available=projects.reduce((s,p)=>s+Number(p.available_quantity_t||0),0)}
 return [...g.values()].map(z=>({...z,forest_count:z.forestSet.size,project_count:z.projectSet.size}));
}

async function ensurePartyData(){
 if(adminData)return adminData;
 const [baseMapRows,baseProjects,baseWorks,costs,growth,activities]=await Promise.all([
  q('forest_os_demo_public_map_filter_current','select=*&order=forest_name'),
  q('forest_os_demo_public_jcredit_project','select=*&order=project_code'),
  q('forest_os_demo_public_work_core_current','select=*&order=work_title').then(rows=>(rows||[]).map(x=>({...x,title:x.work_title,work_type_name:x.work_type_name||x.work_type_code,responsible_party_name:x.responsible_party_name||x.performed_by_party_name}))),
  q('forest_os_ui_accounting_cost_detail','select=*&order=forecast_year,parent_category,cost_category_code'),
  q('forest_os_ui_jcredit_growth','select=*&order=area_version_no,forest_name'),
  q('forest_os_ui_jcredit_program_activity','select=*&order=activity_code'),
  
 ]);
 const mapRows=[...baseMapRows];for(const r of neighborDemo.mapRows)if(!mapRows.some(x=>String(x.forest_unit_id)===String(r.forest_unit_id)))mapRows.push(r);
 const projects=[...baseProjects];for(const p of neighborDemo.projects)if(!projects.some(x=>x.project_code===p.project_code))projects.push(p);
 const works=[...baseWorks];for(const w of neighborDemo.works)if(!works.some(x=>x.title===w.title))works.push(w);
 const projectByCode=new Map(projects.map(p=>[p.project_code,p]));
 const areaByForest=buildAdminAreaMap(growth,activities,projects,mapRows);
 const parties=uniq(mapRows.flatMap(r=>[...safeArr(r.owner_names),...safeArr(r.manager_names),...safeArr(r.work_operator_names)]).concat(projects.flatMap(p=>[p.project_owner_name,p.implementing_party_name])).concat(works.map(w=>w.responsible_party_name)).concat(costs.map(c=>c.vendor)));
 adminData={mapRows,projects,works,costs,growth,activities,delegations:[],projectByCode,areaByForest,parties};
 return adminData;
}
function partyRoleInfo(name,d){
 const roles=new Set();
 d.mapRows.forEach(r=>{
  if(safeArr(r.owner_names).includes(name))roles.add('owner');
  if(safeArr(r.manager_names).includes(name))roles.add('manager');
  if(safeArr(r.work_operator_names).includes(name))roles.add('operator');
 });
 d.projects.forEach(p=>{if(p.project_owner_name===name||p.implementing_party_name===name)roles.add('project');});
 d.works.forEach(w=>{if(w.responsible_party_name===name)roles.add('operator');});
 d.costs.forEach(c=>{if(c.vendor===name)roles.add('vendor');});
 (d.delegations||[]).forEach(x=>{if(x.delegate_name===name)roles.add('agent');});
 return roles;
}
function partyTypeLabel(name,roles,d){
 if(d.mapRows.some(r=>r.region_name===name))return '自治体';
 if(roles.has('agent'))return '山主代理・家族管理者';
 if(String(name).includes('森林組合'))return '森林組合';
 if(String(name).includes('入会会'))return '共有林・入会団体';
 if(String(name).includes('山主')||([...roles].length===1&&roles.has('owner')))return '山主・森林所有者';
 if(String(name).includes('PM')||String(name).includes('森林PM'))return 'PM事業者';
 if(roles.has('operator')&&(String(name).includes('林業')||String(name).includes('株式会社')))return '林業会社・施業者';
 if(roles.has('vendor'))return '外部事業者';
 return '関係事業者・団体';
}
function partyRoleLabel(code){return ({owner:'地権者',manager:'森林管理者',operator:'施業者',project:'J-クレジットPJ運営',vendor:'外注先',agent:'管理代理'})[code]||code;}
function partySectionHtml(title,rows){
 return `<div class="partysection"><h4>${esc(title)}</h4><div class="rows">${rows.length?rows.map(x=>`<div class="partyrow">${x}</div>`).join(''):'<div class="partyrow">該当なし</div>'}</div></div>`;
}

 const roles=partyRoleInfo(name,d);

 const projectCodes=new Set(rows.flatMap(r=>safeArr(r.project_codes)));

 const works=d.works.filter(w=>w.responsible_party_name===name||forestNames.has(w.forest_name));

 const roleTags=[...roles].map(r=>`<span class="tag">${esc(partyRoleLabel(r))}</span>`).join(' ')||'—';
 const forestRows=rows.map(r=>`${esc(r.region_name)}｜${esc(r.forest_name)} <span class="mini">${ha(d.areaByForest.get(r.forest_name)||0)}</span>`);

function renderSoutaniRecoveryMiniMap(rows,targetName){

 const usable=(rows||[]).map(r=>({r,gj:geoObj(r.geom_geojson)})).filter(x=>x.gj);
 if(!usable.length){el.innerHTML='<div class="empty">この森林のCanonical Geometryを取得できないため、位置を推測表示しません。全体地図・森林台帳で確認してください。</div>';return;}
 soutaniRecoveryMiniMap=L.map(el,{zoomControl:true,attributionControl:true,preferCanvas:true,minZoom:9,maxZoom:17});

}

function agencySelectWorkflow(id,btn){
 const rows=(window.agencyWorkflowRows||[]).filter(x=>String(x.workflow_instance_id)===String(id)).sort((a,b)=>Number(a.sequence_no)-Number(b.sequence_no));

 document.querySelectorAll('.agency-case-buttons button').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active');
 const cur=rows.find(x=>x.is_current)||rows[0]; const curSeq=Number(cur.sequence_no||0);
 const steps=rows.map(x=>{const seq=Number(x.sequence_no||0),state=x.is_current?'current':seq<curSeq?'done':'future';const mark=x.is_current?'現在':seq<curSeq?'通過':'次工程';return `<div class="agency-workflow-step ${state}"><b>${esc(x.step_name)}</b><small>${mark}</small></div>`}).join('');

}
