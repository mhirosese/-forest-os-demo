<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest OS</title>
<style>
  :root{
    --bg:#f4f6f4;
    --panel:#ffffff;
    --line:#dfe5df;
    --text:#1f2922;
    --muted:#68736b;
    --accent:#2f5d40;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text)}
  .shell{height:100%;display:flex;flex-direction:column}
  .top{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 10px 8px;
    position:relative;
    z-index:10;
  }
  .brand{font-size:16px;font-weight:700;margin-bottom:8px}
  .tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }
  .tab{
    appearance:none;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    padding:9px 6px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .framewrap{flex:1;min-height:0;background:#fff}
  iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  @media(max-width:520px){
    .top{padding:8px 8px 7px}
    .brand{font-size:15px;margin-bottom:7px}
    .tabs{gap:4px}
    .tab{font-size:11px;padding:8px 3px}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">Forest OS</div>
    <div class="tabs" role="tablist" aria-label="表示切替">
      <button class="tab active" data-src="index.html">森林OS</button>
      <button class="tab" data-src="forest_os_4screens_demo_20260928.html">概要・案件化</button>
      <button class="tab" data-src="forest_os_forestry_demo_operable_20260930.html">事業・財源・成果</button>
    </div>
  </div>
  <div class="framewrap">
    <iframe id="view" src="index.html" title="Forest OS"></iframe>
  </div>
</div>
<script>
const frame=document.getElementById('view');
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    frame.src=btn.dataset.src;
  });
});
</script>
</body>
</html>
